<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IQP Prestone Preview</title><link rel="icon" href="../iqp-logo.png"><style>:root{--gold:#d5a217;--gold2:#f0c650;--line:#ddd;--text:#171717}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f6;color:var(--text)}a{text-decoration:none;color:inherit}.preview{background:#f0c650;color:#111;text-align:center;font-weight:900;padding:8px}.header{background:#09090b;color:#fff;position:sticky;top:0;z-index:5;border-bottom:4px solid var(--gold)}.top{max-width:1450px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}.brand{display:flex;align-items:center;gap:12px}.brand img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid #ad8831}.brand h1{font-size:22px;margin:0}.brand small{color:#ebd187;letter-spacing:1.5px}.cart{border:0;border-radius:999px;background:linear-gradient(#c91f29,#a80e17);color:#fff;font-weight:900;padding:10px 14px}.cart span{background:var(--gold2);color:#111;border-radius:99px;padding:4px 7px}.nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#0b0b0d;padding:8px}.nav a{color:#ddd;font-size:12px;font-weight:900;padding:7px 12px;border-radius:99px}.nav a.active{background:var(--gold2);color:#111}.toolbar{max-width:1450px;margin:16px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr 170px;gap:12px}.search{border:1px solid #ccc;border-radius:12px;padding:13px;background:#fff;font:inherit}.cartbtn{border:0;border-radius:12px;background:#111;color:#fff;font-weight:900}.summary{max-width:1450px;margin:auto;padding:12px 16px;color:#555}.grid{max-width:1450px;margin:auto;padding:8px 16px 90px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.06);display:flex;flex-direction:column;min-width:0}.photo{height:240px;display:flex;align-items:center;justify-content:center;padding:14px;border-bottom:4px solid var(--gold);overflow:hidden;background:#fff}.photo img{display:block;width:180px;height:205px;object-fit:contain;object-position:center;margin:auto}.body{padding:13px;display:flex;flex-direction:column;flex:1}.cat{font-size:11px;color:#9a7700;font-weight:900;letter-spacing:1px}.part{font-size:23px;font-weight:900;margin:5px 0 4px}.desc{font-size:13px;color:#555;line-height:1.35;min-height:52px}.price-label{font-size:11px;color:#777;font-weight:900;margin-top:8px}.price{font-size:23px;font-weight:900;margin-top:2px}.official{font-size:11px;font-weight:900;color:#6d5500;margin:7px 0}.buy{display:grid;grid-template-columns:72px 1fr;gap:8px;margin-top:auto;padding-top:8px}.qty{width:100%;padding:9px;border:1px solid #bbb;border-radius:9px;text-align:center}.add{border:0;border-radius:9px;background:#111;color:#fff;font-weight:900;padding:9px 6px}.footer{text-align:center;color:#777;padding:25px}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:930px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:215px}.photo img{width:155px;height:180px}.brand h1{font-size:18px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.photo{height:245px}.photo img{width:185px;height:210px}}</style></head><body><div class="preview">PREVIEW ONLY · PRESTONE FIXED IMAGE LAYOUT</div><header class="header"><div class="top"><div class="brand"><img src="../iqp-logo.png" alt="IQP"><div><h1>International Quality Parts</h1><small>PRESTONE STOCK ORDER PREVIEW</small></div></div><button class="cart" onclick="openCart()">CART <span id="cartCount">0</span></button></div><nav class="nav"><a href="index.html">PREVIEW HOME</a><a href="../wix.html">WIX</a><a href="../wai.html">WAI</a><a href="chemicals.html?line=bluedevil">BLUEDEVIL</a><a class="active" href="prestone.html">PRESTONE</a></nav></header><section class="toolbar"><input id="search" class="search" placeholder="Search Prestone part number or product name..."><button class="cartbtn" onclick="openCart()">OPEN SHARED CART</button></section><div class="summary" id="summary"></div><main class="grid" id="grid"></main><footer class="footer">International Quality Parts · Preview</footer><script>const products=[
{id:'AF3200',part:'AF3200',description:'Prestone Prime Conventional Green Concentrate - 1 gal',price:8.99,image:'https://highlinewarrenproduction.s3.us-east-2.amazonaws.com/DAMRoot/Original/10132/AF3200%20Front%20NG.jpg',source:'https://www.prestone.com/product/prime-conventional-green/'},
{id:'AF3300',part:'AF3300',description:'Prestone Prime Conventional Green 50/50 Prediluted - 1 gal',price:6.99,image:'https://i.ebayimg.com/images/g/IOMAAeSwMihpzAxO/s-l1600.jpg',source:'https://www.prestone.com/product/prime-conventional-green/'},

{id:'AF3400',part:'AF3400',description:'Prestone Prime Orange Compatible Concentrate - 1 gal',price:10.50,image:'https://s3.amazonaws.com/aapa.image.store/PRODDIR007/a2ac663d-74e4-4be7-89e3-d281c43d89d7.jpg',source:'https://www.prestone.com/product/prime-orange-compatible-antifreeze-coolant/'},

{id:'AF6510',part:'AF6510',description:'Prestone MAX European Violet Ready to Use - 1 gal',price:9.99,image:'https://i5.walmartimages.com/asr/3cce9146-e423-412f-87c8-14a70f29d908.158a3cd9812915c38213c17da255fc22.jpeg?odnBg=FFFFFF&odnHeight=768&odnWidth=768',source:'https://www.prestone.com/'},
{id:'AF6110',part:'AF6110',description:'Prestone MAX European Blue/Teal Ready to Use - 1 gal',price:8.99,image:'https://images.matjrah.online/4824/image/cache/catalog/1759787318-1000150033-1200x1598.jpg',source:'https://www.prestone.com/'},

{id:'AF6210',part:'AF6210',description:'Prestone MAX Asian Red Ready to Use - 1 gal',price:9.50,image:'https://cdn1.cybassets.com/media/W1siZiIsIjI2MDU1L3Byb2R1Y3RzLzQxNjM3ODc5LzE2OTAzNDcxNDVfMzRjMzk1OGM2ZmE0N2VmNDdhZDQucG5nIl0sWyJwIiwidGh1bWIiLCI2MDB4NjAwIl1d.png?sha=33e8b86c8f72fa01',source:'https://www.prestone.com/product/prestonemax-asian-vehicles-red-antifreezecoolant/'}];let cart={};const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function sid(s){return String(s).replace(/[^a-zA-Z0-9]/g,'_')}function restore(){try{cart=JSON.parse(localStorage.getItem('iqp-v7-cart'))||{}}catch{cart={}}}function save(){localStorage.setItem('iqp-v7-cart',JSON.stringify(cart))}function count(){$('cartCount').textContent=Object.values(cart).reduce((n,x)=>n+(Number(x.qty)||0),0)}function render(){const q=$('search').value.trim().toLowerCase(),shown=products.filter(x=>!q||x.part.toLowerCase().includes(q)||x.description.toLowerCase().includes(q));$('summary').textContent=`Showing ${shown.length} PRESTONE products · Sell prices shown below.`;$('grid').innerHTML=shown.map(x=>`<article class="card"><div class="photo"><img src="${esc(x.image)}" alt="${esc(x.description)}"></div><div class="body"><div class="cat">PRESTONE</div><div class="part">${x.part}</div><div class="desc">${esc(x.description)}</div><div class="price-label">SELL PRICE</div><div class="price">${money(x.price)}</div><a class="official" href="${esc(x.source)}" target="_blank" rel="noopener">VIEW MANUFACTURER PRODUCT ↗</a><div class="buy"><input class="qty" id="q_${sid(x.id)}" type="number" min="1" value="1"><button class="add" onclick="add('${x.id}')">ADD TO CART</button></div></div></article>`).join('')}function add(id){const x=products.find(v=>v.id===id),q=Math.max(1,parseInt($('q_'+sid(id)).value||'1')),key=`PRESTONE:${id}`;if(!cart[key])cart[key]={...x,brand:'PRESTONE',cartKey:key,qty:0};cart[key].qty+=q;save();count();$('q_'+sid(id)).value=1}function openCart(){location.href='../wix.html?cart=1'}restore();count();$('search').addEventListener('input',render);render();</script></body></html>
