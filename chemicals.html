<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iqp-logo.png">
<link rel="apple-touch-icon" href="iqp-logo.png">
<title>International Quality Parts | Chemical Products</title>
<style>
:root{--black:#0d0d0f;--gold:#d5a217;--gold2:#f0c650;--red:#b5121b;--soft:#f4f4f6;--white:#fff;--line:#dddddf;--text:#171717;--muted:#666;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#ececef 0%,#f5f5f7 240px,#f4f4f6 100%);color:var(--text)}a{text-decoration:none;color:inherit}.header{background:linear-gradient(180deg,#050506 0%,#111114 75%);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.25);position:sticky;top:0;z-index:50}.topbar{max-width:1450px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative}.brand{display:flex;gap:14px;align-items:center}.brand img{width:78px;height:78px;object-fit:cover;border-radius:12px;border:2px solid #ad8831}.brand h1{margin:0;font-size:28px;line-height:1;font-weight:900}.brand div div{margin-top:6px;font-size:12px;color:#ebd187;text-transform:uppercase;letter-spacing:2px;font-weight:700}.header-cart{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:linear-gradient(180deg,#c91f29,#a80e17);color:#fff;font-weight:900;cursor:pointer;padding:10px 14px}.header-cart span{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--gold2);color:#111}.goldline{height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}.line-nav{display:flex;justify-content:center;gap:8px;padding:9px 16px;background:#0b0b0d;border-top:1px solid #29292d;flex-wrap:wrap}.line-nav a{padding:8px 14px;border-radius:999px;color:#ddd;font-size:12px;font-weight:900}.line-nav a:hover,.line-nav a.active{background:var(--gold);color:#111}.hero{background:radial-gradient(circle at 90% 15%,rgba(213,162,23,.22),transparent 20%),radial-gradient(circle at 10% 0%,rgba(181,18,27,.22),transparent 25%),linear-gradient(135deg,#090909,#151518 50%,#0c0c0d);color:#fff}.herowrap{max-width:1450px;margin:auto;padding:30px 16px}.tag{display:inline-block;padding:8px 14px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:1px}.hero h2{margin:14px 0 8px;font-size:42px}.hero p{max-width:760px;font-size:16px;color:#ececec;line-height:1.55}.toolbar{max-width:1450px;margin:16px auto 0;padding:0 16px;display:grid;grid-template-columns:1fr 170px;gap:12px}.search{border:1px solid #cfcfd4;border-radius:12px;padding:13px 14px;background:#fff;font:inherit}.cartbtn{border:0;border-radius:12px;background:linear-gradient(180deg,#c91f29,#a80e17);color:#fff;font-weight:900;cursor:pointer;padding:13px 16px}.summary{max-width:1450px;margin:0 auto;padding:12px 16px 4px;color:#555;font-size:14px}.grid{max-width:1450px;margin:0 auto;padding:8px 16px 120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.06);display:flex;flex-direction:column}.product-image{height:220px;background:linear-gradient(145deg,#f9f9fa,#ececef);display:grid;place-items:center;padding:18px;border-bottom:4px solid var(--gold)}.bottle{position:relative;width:112px;height:168px;border-radius:18px 18px 24px 24px;box-shadow:0 12px 25px rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px;color:#fff;font-weight:900}.bottle:before{content:"";position:absolute;top:-18px;width:55px;height:25px;border-radius:7px 7px 3px 3px;background:#222}.bottle .logo{font-size:18px;line-height:1.05}.bottle .sku{font-size:15px;margin-top:10px;padding:6px 8px;background:rgba(255,255,255,.92);color:#111;border-radius:7px}.bottle.blue{background:linear-gradient(160deg,#164b9d,#081f50 70%)}.bottle.prestone{background:linear-gradient(160deg,#f4c400,#d97b00 70%);color:#111}.cardbody{padding:15px}.cat{font-size:11px;color:#9a7700;font-weight:900;letter-spacing:1px;text-transform:uppercase}.part{font-size:24px;font-weight:900;margin:6px 0 4px}.price-label{font-size:11px;color:#777;font-weight:900;letter-spacing:1px}.price{font-size:24px;font-weight:900;margin:3px 0 8px}.buyrow{display:grid;grid-template-columns:78px 1fr;gap:8px;margin-top:10px}.qty{width:100%;padding:10px 6px;border:1px solid #bbb;border-radius:9px;text-align:center;background:#fff}.add{border:0;border-radius:9px;background:#111;color:#fff;font-weight:900;cursor:pointer}.footer{text-align:center;color:#777;font-size:12px;padding:28px 18px;border-top:1px solid #ddd}@media(max-width:720px){.brand img{width:64px;height:64px}.brand h1{font-size:21px}.header-cart{position:absolute;right:16px;top:18px}.brand{padding-right:85px}.hero h2{font-size:32px}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.product-image{height:190px}.bottle{width:96px;height:145px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.product-image{height:210px}}
</style>
</head>
<body>
<header class="header"><div class="topbar"><div class="brand"><img src="iqp-logo.png" alt="International Quality Parts"><div><h1>International Quality Parts</h1><div id="portalTitle">Stock Order Portal</div></div></div><button class="header-cart" onclick="openSharedCart()">CART <span id="cartCount">0</span></button></div><div class="goldline"></div><nav class="line-nav"><a href="index.html">HOME</a><a href="wix.html">WIX</a><a href="wai.html">WAI</a><a id="blueNav" href="chemicals.html?line=bluedevil">BLUEDEVIL</a><a id="prestoneNav" href="chemicals.html?line=prestone">PRESTONE</a></nav></header>
<section class="hero"><div class="herowrap"><span class="tag" id="lineTag">CHEMICALS</span><h2 id="lineTitle">Products</h2><p id="lineCopy">Choose quantities and add products to the same shared IQP cart used by WIX and WAI.</p></div></section>
<section class="toolbar"><input id="search" class="search" placeholder="Search part number..." autocomplete="off"><button class="cartbtn" onclick="openSharedCart()">OPEN SHARED CART</button></section>
<div class="summary" id="summary"></div><main class="grid" id="grid"></main><footer class="footer">International Quality Parts · 4330 E 10th Ct, Hialeah, FL 33013 · 786-355-1606</footer>
<script>
const params=new URLSearchParams(location.search);const line=(params.get('line')||'bluedevil').toLowerCase();const isPrestone=line==='prestone';const LINE=isPrestone?'PRESTONE':'BLUEDEVIL';const file=isPrestone?'prestone-products.json':'bluedevil-products.json';let products=[];let cart={};const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function safeId(s){return String(s).replace(/[^a-zA-Z0-9]/g,'_')}function restoreCart(){try{cart=JSON.parse(localStorage.getItem('iqp-v7-cart'))||{}}catch{cart={}}}function saveCart(){localStorage.setItem('iqp-v7-cart',JSON.stringify(cart))}function cartCount(){return Object.values(cart).reduce((n,x)=>n+(Number(x.qty)||0),0)}function updateCount(){$('cartCount').textContent=cartCount()}function productArt(p){return `<div class="bottle ${isPrestone?'prestone':'blue'}"><div class="logo">${isPrestone?'PRESTONE':'BLUE DEVIL'}</div><div class="sku">${esc(p.part)}</div></div>`}function render(){const q=$('search').value.trim().toLowerCase();const shown=products.filter(p=>!q||p.part.toLowerCase().includes(q));$('summary').textContent=`Showing ${shown.length} ${LINE} products · Sell prices shown below.`;$('grid').innerHTML=shown.map(p=>`<article class="card"><div class="product-image" aria-label="${esc(LINE)} product ${esc(p.part)}">${productArt(p)}</div><div class="cardbody"><div class="cat">${esc(LINE)}</div><div class="part">${esc(p.part)}</div><div class="price-label">SELL PRICE</div><div class="price">${money(p.price)}</div><div class="buyrow"><input class="qty" id="q_${safeId(p.id)}" type="number" min="1" value="1"><button class="add" onclick="addToCart('${p.id}')">ADD TO CART</button></div></div></article>`).join('')}function addToCart(id){const p=products.find(x=>x.id===id);const q=Math.max(1,parseInt($('q_'+safeId(id)).value||'1'));const key=`${LINE}:${id}`;if(!cart[key])cart[key]={...p,brand:LINE,cartKey:key,qty:0};cart[key].qty+=q;saveCart();updateCount();$('q_'+safeId(id)).value=1}function openSharedCart(){location.href='wix.html?cart=1'}async function init(){restoreCart();updateCount();$('portalTitle').textContent=`${LINE} Stock Order Portal`;$('lineTitle').textContent=isPrestone?'PRESTONE':'BLUE DEVIL';$('lineTag').textContent=isPrestone?'ANTIFREEZE & COOLANT':'AUTOMOTIVE CHEMICALS';$('lineTag').style.background=isPrestone?'#f3c400':'#155aa8';$('lineTag').style.color=isPrestone?'#111':'#fff';$('lineCopy').textContent=`Browse ${LINE} products. Each card shows the product, part number, and sell price. Items stay in the same IQP shared cart.`;$(isPrestone?'prestoneNav':'blueNav').classList.add('active');products=await fetch(file+'?v=20260820',{cache:'no-store'}).then(r=>r.json());$('search').addEventListener('input',render);render()}init();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
</script>
</body></html>
